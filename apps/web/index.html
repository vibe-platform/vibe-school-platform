<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ff" />
    <meta name="description" content="Вайб — личный путь, интересные задания и школьные награды." />
    <link rel="icon" type="image/png" href="/brand/vibe-logo.png" />
    <title>Вайб — школьная жизнь интереснее</title>
    <script>
      (() => {
        let mode = "system";
        try { const saved = localStorage.getItem("vibe-theme-mode"); if (["light", "dark", "system"].includes(saved)) mode = saved; } catch {}
        const dark = mode === "dark" || (mode === "system" && window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = dark ? "#11172a" : "#f5f2ff";
      })();
    </script>
  </head>
  <body><div id="root"></div><script src="https://st.max.ru/js/max-web-app.js"></script><script type="module" src="/src/main.tsx"></script></body>
</html>
