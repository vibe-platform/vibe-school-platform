name: Publish contest image
on:
  workflow_run:
    workflows: ["Contest checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify existing package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          package=$(gh api --silent /users/vibe-platform/packages/container/vibe-school-platform 2>/dev/null && echo present || true)
          if [ "$package" = present ]; then
            visibility=$(gh api /users/vibe-platform/packages/container/vibe-school-platform --jq .visibility)
            test "$visibility" = public
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vibe-platform/vibe-school-platform:contest
            ghcr.io/vibe-platform/vibe-school-platform:sha-${{ github.event.workflow_run.head_sha }}
      - name: Verify package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /users/vibe-platform/packages/container/vibe-school-platform --jq .visibility | grep -x public
          echo "Public image: ghcr.io/vibe-platform/vibe-school-platform:contest" >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    needs: publish
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Pull public image and verify independently
        run: |
          set -eu
          image="ghcr.io/vibe-platform/vibe-school-platform:sha-${{ github.event.workflow_run.head_sha }}"
          docker pull "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee -a "$GITHUB_STEP_SUMMARY"
          docker run -d --name vibe-registry-test -p 127.0.0.1:3101:3101 "$image"
          trap 'docker logs vibe-registry-test; docker rm -f vibe-registry-test' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3101/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:3101/ > /dev/null
          docker exec vibe-registry-test node /app/scripts/check-public-content.mjs
